<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型管理</title>
    <style>
      /* 管理窗独立样式：简洁 Material 风，与主窗 style.css 解耦 */
      :root {
        color-scheme: light dark;
        --border: rgba(0, 0, 0, 0.12);
        --muted: rgba(0, 0, 0, 0.55);
        --text: rgba(0, 0, 0, 0.85);
        --accent: #d97757;
        --accent-strong: #c9684b;
        --danger: #d93025;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --border: rgba(255, 255, 255, 0.16);
          --muted: rgba(255, 255, 255, 0.6);
          --text: rgba(255, 255, 255, 0.9);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
        color: var(--muted);
        padding: 14px;
      }
      h2 { font-size: 15px; margin: 0 0 10px; color: currentColor; }
      ul { list-style: none; margin: 0 0 12px; padding: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 6px;
      }
      li .name { flex: 1; color: currentColor; font-weight: 500; }
      li .meta { font-size: 11px; }
      li.active .name::after { content: " ✓"; color: var(--accent); }
      button {
        font: inherit;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: currentColor;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.danger { color: var(--danger); }
      form { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 8px; }
      label { display: grid; gap: 3px; font-size: 12px; }
      input[type="text"], input[type="password"] {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: currentColor;
      }
      /* select 换成自绘箭头：appearance:none 去掉 macOS 原生 stepper，弹出菜单仍由系统提供 */
      select {
        font: inherit;
        padding: 6px 26px 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 9px center;
        cursor: pointer;
      }
      .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
      .row label { flex: 1; min-width: 130px; }
      .row .check { display: flex; align-items: center; gap: 6px; padding-bottom: 7px; flex: 0 0 auto; min-width: 0; }
      .row .check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        padding: 6px 22px;
        border-radius: 8px;
        font-weight: 500;
      }
      button.primary:hover { background: var(--accent-strong); }
      button.primary:active { transform: translateY(0.5px); }
      #msg { color: var(--danger); font-size: 12px; min-height: 16px; }
      #msg.ok { color: var(--accent); }
      .editing-tag { font-size: 11px; color: var(--accent); }
    </style>
  </head>
  <body>
    <h2>模型条目</h2>
    <ul id="list"></ul>
    <form id="form">
      <h2>编辑 <span id="editing-tag" class="editing-tag"></span></h2>
      <label>名称
        <input type="text" id="name" placeholder="如：GLM-5.3-Flash" required />
      </label>
      <div class="row">
        <label>上游格式
          <select id="format">
            <option value="openai">openai（Chat Completions）</option>
            <option value="anthropic">anthropic（Messages）</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="supports1m" />
          支持 1M
        </label>
      </div>
      <label>Base URL
        <input type="text" id="baseUrl" placeholder="openai 填根地址；anthropic 填 ANTHROPIC_BASE_URL 形态" required />
      </label>
      <label>Token
        <input type="password" id="token" placeholder="Bearer token" required />
      </label>
      <label>模型名
        <input type="text" id="model" placeholder="claude-* 角色模型名统一替换为它" required />
      </label>
      <div class="actions">
        <button type="button" id="cancel" hidden>取消编辑</button>
        <button type="button" id="test">测试</button>
        <button type="submit" class="primary">保存</button>
      </div>
      <div id="msg"></div>
    </form>
    <script type="module" src="/src/manager.ts"></script>
  </body>
</html>
